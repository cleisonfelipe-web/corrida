<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>corrida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-panel">
        <div class="stat-box">
            <p>PONTOS</p>
            <span id="score">0</span>
        </div>
        <button id="pause-btn">PAUSE</button>
    </div>

    <div id="board">
        <div class="lane-line"></div>
        <div id="player"></div>
        <div id="pause-overlay" style="display:none; position:absolute; width:100%; height:100%; background:rgba(0,0,0,0.5); color:white; align-items:center; justify-content:center; z-index:5;">PAUSADO</div>
        
        <div id="game-over-screen">
            <h2>FIM DE JOGO</h2>
            <p>Pontos: <span id="final-score">0</span></p>
            <p>RECORDE: <span id="high-score">0</span></p>
            <button id="restart-btn" style="padding:10px; background:#cc0000; color:white; border:1px solid white; cursor:pointer;">REINICIAR</button>
        </div>
    </div>

    <div id="controls">
        <button class="btn" id="left-btn">◀</button>
        <button class="btn" id="right-btn">▶</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
